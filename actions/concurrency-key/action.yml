name: 计算并发组标识
description: 对复用工作流的全部入参计算稳定短指纹，作为并发组的调用标识，避免同一调用工作流的多次调用互相取消
inputs:
  payload:
    description: 指纹载荷，调用方固定传 toJSON(inputs) 的求值结果（workflow 内 with: payload 的模板写法见 README 并发组一节；description 中不可用模板表达式）
    required: true
outputs:
  key:
    description: 12 位十六进制调用指纹
    value: ${{ steps.fingerprint.outputs.key }}
runs:
  using: composite
  steps:
    - id: fingerprint
      shell: bash
      env:
        PAYLOAD: ${{ inputs.payload }}
      run: |
        set -euo pipefail
        # 指纹覆盖全部入参：任何入参不同都会得到不同并发组，互不取消；
        # 入参不变则指纹不变，同一调用的新提交仍能按原组取代旧运行。
        # 依赖 GNU coreutils 的 sha256sum（GitHub 托管 ubuntu runner 自带），
        # 未在 macos/windows runner 上验证。指纹基于 toJSON(inputs) 原文，
        # 键序随工作流入参声明序固定；若序列化行为变化，仅造成一次取代中断。
        echo "key=$(printf '%s' "$PAYLOAD" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
