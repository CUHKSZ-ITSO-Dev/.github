name: Go Test

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      go-version:
        required: false
        type: string
        default: ""
      go-version-file:
        required: false
        type: string
        default: ""
      cache-dependency-path:
        required: false
        type: string
        default: "**/go.sum"
      changed-paths:
        required: false
        type: string
        default: |
          **/*.go
          go.mod
          **/go.mod
          go.sum
          **/go.sum
          .golangci.yml
          **/.golangci.yml
          .golangci.yaml
          **/.golangci.yaml
      test-flags:
        required: false
        type: string
        default: "-timeout 10m"
      database-kind:
        required: false
        type: string
        default: none
      database-name:
        required: false
        type: string
        default: go_test
      app-database-name:
        required: false
        type: string
        default: ""
      lfs-include:
        required: false
        type: string
        default: ""
      cgo-enabled:
        required: false
        type: string
        default: ""
      cgo-ldflags:
        required: false
        type: string
        default: ""
      cgo-library-dir:
        required: false
        type: string
        default: ""
      prepare-command:
        required: false
        type: string
        default: ""
      skip-draft-pr:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 准备路径过滤配置
        id: filter-config
        env:
          CHANGED_PATHS: ${{ inputs.changed-paths }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os

          print("filters<<EOF")
          print("changed:")
          for pattern in os.environ["CHANGED_PATHS"].splitlines():
              pattern = pattern.strip()
              if pattern:
                  print(f"  - {pattern!r}")
          print("EOF")
          PY

      - name: 检查相关改动
        id: changed
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.filter-config.outputs.filters }}
          token: ${{ github.token }}

      - name: 判断是否执行测试
        id: plan
        env:
          FILTER_OUTPUT: ${{ steps.changed.outputs.changed }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.skip-draft-pr }}" = "true" ] &&
            [ "${{ github.event_name }}" = "pull_request" ] &&
            [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "草稿 PR 跳过 Go Test。"
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            if [ "$FILTER_OUTPUT" = "true" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "无 Go 相关改动，跳过 Go Test。"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 恢复 Git LFS 缓存
        id: lfs
        if: steps.plan.outputs.run == 'true' && inputs.lfs-include != ''
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ github.repository }}-${{ github.sha }}
          restore-keys: lfs-${{ github.repository }}-

      - name: 拉取 Git LFS 文件
        if: steps.plan.outputs.run == 'true' && inputs.lfs-include != ''
        run: |
          git lfs pull
          git lfs pull --include="${{ inputs.lfs-include }}"

      - name: 保存 Git LFS 缓存
        if: steps.plan.outputs.run == 'true' && inputs.lfs-include != '' && steps.lfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.cache-primary-key }}

      - uses: actions/setup-go@v6
        if: steps.plan.outputs.run == 'true' && inputs.go-version-file != ''
        with:
          cache: false
          go-version-file: ${{ inputs.go-version-file }}

      - uses: actions/setup-go@v6
        if: steps.plan.outputs.run == 'true' && inputs.go-version-file == '' && inputs.go-version != ''
        with:
          cache: false
          go-version: ${{ inputs.go-version }}

      - uses: actions/setup-go@v6
        if: steps.plan.outputs.run == 'true' && inputs.go-version-file == '' && inputs.go-version == ''
        with:
          cache: false
          go-version-file: ${{ inputs.working-directory }}/go.mod

      - name: 恢复 Go 缓存
        if: steps.plan.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}-
            go-test-${{ runner.os }}-

      - name: 准备测试数据库参数
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail

          case "${{ inputs.database-kind }}" in
            none|postgres|sqlserver) ;;
            *) echo "::error::database-kind 仅支持 none、postgres 或 sqlserver。"; exit 1 ;;
          esac

          if [ "${{ inputs.database-kind }}" = "postgres" ] && [ -n "${{ inputs.app-database-name }}" ]; then
            echo "MIGRATION_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/${{ inputs.app-database-name }}?sslmode=disable" >> "$GITHUB_ENV"
            echo "MIGRATION_TEST_GOFRAME_LINK=pgsql:postgres:postgres@tcp(localhost:5432)/${{ inputs.app-database-name }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.database-kind }}" = "sqlserver" ] && [ -n "${{ inputs.app-database-name }}" ]; then
            echo "MIGRATION_TEST_DATABASE_URL=sqlserver://sa:DevPass123%21@localhost:1433?database=${{ inputs.app-database-name }}&encrypt=disable" >> "$GITHUB_ENV"
            echo "MIGRATION_TEST_GOFRAME_LINK=mssql:sa:DevPass123!@tcp(localhost:1433)/${{ inputs.app-database-name }}?encrypt=disable" >> "$GITHUB_ENV"
          fi

      - name: 准备 CGO 参数
        if: steps.plan.outputs.run == 'true' && (inputs.cgo-enabled != '' || inputs.cgo-ldflags != '' || inputs.cgo-library-dir != '')
        env:
          INPUT_CGO_ENABLED: ${{ inputs.cgo-enabled }}
          INPUT_CGO_LDFLAGS: ${{ inputs.cgo-ldflags }}
          INPUT_CGO_LIBRARY_DIR: ${{ inputs.cgo-library-dir }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_CGO_ENABLED" ]; then
            echo "CGO_ENABLED=$INPUT_CGO_ENABLED" >> "$GITHUB_ENV"
          fi

          if [ -n "$INPUT_CGO_LDFLAGS" ]; then
            echo "CGO_LDFLAGS=$INPUT_CGO_LDFLAGS" >> "$GITHUB_ENV"
          elif [ -n "$INPUT_CGO_LIBRARY_DIR" ]; then
            library_dir="${INPUT_CGO_LIBRARY_DIR#/}"
            echo "CGO_LDFLAGS=-L${GITHUB_WORKSPACE}/${library_dir}" >> "$GITHUB_ENV"
          fi

      - name: 启动 PostgreSQL
        if: steps.plan.outputs.run == 'true' && inputs.database-kind == 'postgres'
        run: |
          set -euo pipefail
          docker run -d --name go-test-postgres \
            -e POSTGRES_DB="${{ inputs.database-name }}" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 postgres:17
          for _ in {1..30}; do
            if docker exec go-test-postgres pg_isready -U postgres -d "${{ inputs.database-name }}" >/dev/null 2>&1; then
              if [ -n "${{ inputs.app-database-name }}" ]; then
                docker exec go-test-postgres createdb -U postgres "${{ inputs.app-database-name }}"
              fi
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL 未就绪"
          exit 1

      - name: 启动 SQL Server
        if: steps.plan.outputs.run == 'true' && inputs.database-kind == 'sqlserver'
        run: |
          set -euo pipefail
          wait_database() {
            local database_name="$1"
            for _ in {1..30}; do
              if docker exec go-test-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DevPass123!' -C -d "$database_name" -Q 'SELECT 1' >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "::error::SQL Server 数据库 ${database_name} 未就绪"
            return 1
          }
          docker run -d --name go-test-sqlserver \
            -e ACCEPT_EULA=Y \
            -e 'MSSQL_SA_PASSWORD=DevPass123!' \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for _ in {1..60}; do
            if docker exec go-test-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DevPass123!' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              docker exec go-test-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DevPass123!' -C -Q "CREATE DATABASE [${{ inputs.database-name }}]"
              wait_database "${{ inputs.database-name }}"
              if [ -n "${{ inputs.app-database-name }}" ]; then
                docker exec go-test-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DevPass123!' -C -Q "CREATE DATABASE [${{ inputs.app-database-name }}]"
                wait_database "${{ inputs.app-database-name }}"
              fi
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server 未就绪"
          exit 1

      - name: 准备测试配置
        if: steps.plan.outputs.run == 'true' && inputs.prepare-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.prepare-command }}

      - name: 运行 Go 测试
        if: steps.plan.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          PGPASSWORD: postgres
          TEST_FLAGS: ${{ inputs.test-flags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # test-flags 是受控 workflow 输入，需要拆分为 Go 参数。
          go test ${TEST_FLAGS} ./...
