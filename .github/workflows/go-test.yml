name: Go Test

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      go-version:
        required: false
        type: string
        default: "1.27.2"
      go-version-file:
        required: false
        type: string
        default: ""
      cache-dependency-path:
        required: false
        type: string
        default: "**/go.sum"
      changed-paths:
        required: false
        type: string
        default: |
          **/*.go
          go.mod
          **/go.mod
          go.sum
          **/go.sum
          .golangci.yml
          **/.golangci.yml
          .golangci.yaml
          **/.golangci.yaml
      test-flags:
        required: false
        type: string
        default: "-timeout 10m"
      database-kind:
        required: false
        type: string
        default: none
      database-name:
        required: false
        type: string
        default: go_test
      app-database-name:
        required: false
        type: string
        default: ""
      lfs-include:
        required: false
        type: string
        default: ""
      cgo-enabled:
        required: false
        type: string
        default: ""
      cgo-ldflags:
        required: false
        type: string
        default: ""
      cgo-library-dir:
        required: false
        type: string
        default: ""
      prepare-command:
        required: false
        type: string
        default: ""
      minimum-free-disk-gib:
        required: false
        type: number
        default: 20
      clean-unused-sdks:
        required: false
        type: boolean
        default: true
      skip-draft-pr:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: shared-go-test-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory || '.' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 读取统一 CI 配置
        id: policy
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-policy@main
        with:
          kind: go-test
          legacy-inputs: ${{ toJSON(inputs) }}

      - name: 检查迁移文件
        uses: CUHKSZ-ITSO-Dev/.github/actions/check-migration-files@main
        with:
          entry: go-test
          checkout: "true"

      - name: 开始资源采样
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: start

      - name: 判断检查范围
        id: plan
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-scope@main
        with:
          changed-paths: ${{ steps.policy.outputs.changed-paths }}
          skip-draft-pr: ${{ steps.policy.outputs.skip-draft-pr }}

      - name: 在 GitHub runner 执行 Go Test
        id: primary
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        uses: CUHKSZ-ITSO-Dev/.github/actions/go-test-hosted@main
        with:
          policy-json: ${{ toJSON(steps.policy.outputs) }}

      - name: 确认失败原因并按需回退 DevPortal
        if: steps.primary.outcome == 'failure' && !cancelled()
        uses: CUHKSZ-ITSO-Dev/.github/actions/go-test-fallback@main
        with:
          token: ${{ github.token }}

      - name: 输出资源采样
        if: always()
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: finish
