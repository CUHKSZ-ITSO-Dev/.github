name: PR 预检请求登记

on:
  workflow_call:
    inputs:
      service:
        description: Dev Portal 服务标识
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: dev-portal-precheck-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  submit:
    name: 写入提交状态
    runs-on: ubuntu-slim
    steps:
      - name: 登记集群预检请求
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PORTAL_URL: https://testopenai-dev03.cuhk.edu.cn/dev/checks
        run: |
          set -euo pipefail
          payload="{\"state\":\"pending\",\"context\":\"Dev Portal / 开发环境预检\",\"description\":\"等待集群领取预检任务\",\"target_url\":\"${PORTAL_URL}\"}"
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${API_URL}/repos/${REPOSITORY}/statuses/${COMMIT_SHA}"
          echo "预检请求已登记；源码获取、构建和校验均由集群内 Dev Portal 完成。"
