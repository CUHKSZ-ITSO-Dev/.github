name: golangci-lint

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      go-version:
        required: false
        type: string
        default: "1.27.2"
      go-version-file:
        required: false
        type: string
        default: ""
      cache-dependency-path:
        required: false
        type: string
        default: ""
      golangci-version:
        required: false
        type: string
        default: v2.14.0
      changed-paths:
        required: false
        type: string
        default: |
          **/*.go
          go.mod
          **/go.mod
          go.sum
          **/go.sum
          .golangci.yml
          **/.golangci.yml
          .golangci.yaml
          **/.golangci.yaml
      lfs-include:
        required: false
        type: string
        default: ""
      cgo-enabled:
        required: false
        type: string
        default: ""
      cgo-ldflags:
        required: false
        type: string
        default: ""
      cgo-library-dir:
        required: false
        type: string
        default: ""
      skip-draft-pr:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    concurrency:
      group: shared-golangci-lint-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory || '.' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 读取统一 CI 配置
        id: policy
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-policy@main
        with:
          kind: golangci-lint
          legacy-inputs: ${{ toJSON(inputs) }}

      - name: 开始资源采样
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: start

      - name: 判断检查范围
        id: plan
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-scope@main
        with:
          changed-paths: ${{ steps.policy.outputs.changed-paths }}
          skip-draft-pr: ${{ steps.policy.outputs.skip-draft-pr }}

      - uses: actions/checkout@v7.0.1
        if: steps.plan.outputs.run == 'true' && github.event_name != 'push'
        with:
          persist-credentials: false

      - name: 计算 Git LFS 内容缓存键
        id: lfs-key
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.lfs-include != ''
        env:
          LFS_INCLUDE: ${{ steps.policy.outputs.lfs-include }}
        run: |
          set -euo pipefail
          # 缓存对象由 LFS OID 决定，普通代码提交不应复制相同二进制缓存。
          objects=$(git lfs ls-files --long --include="$LFS_INCLUDE" | awk '{print $1}' | LC_ALL=C sort -u)
          echo "hash=$(printf '%s' "$objects" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 恢复 Git LFS 缓存
        id: lfs
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.lfs-include != ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ github.repository }}-${{ steps.lfs-key.outputs.hash }}
          restore-keys: lfs-${{ github.repository }}-

      - name: 拉取 Git LFS 文件
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.lfs-include != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LFS_INCLUDE: ${{ steps.policy.outputs.lfs-include }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git lfs pull --include="$LFS_INCLUDE"

      - name: 保存 Git LFS 缓存
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.lfs-include != '' && steps.lfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.cache-primary-key }}

      - uses: actions/setup-go@v7.0.0
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.go-version-file == ''
        with:
          cache: true
          cache-dependency-path: ${{ steps.policy.outputs.cache-dependency-path }}
          go-version: ${{ steps.policy.outputs.go-version }}

      - uses: actions/setup-go@v7.0.0
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.go-version-file != ''
        with:
          cache: true
          cache-dependency-path: ${{ steps.policy.outputs.cache-dependency-path }}
          go-version-file: ${{ steps.policy.outputs.go-version-file }}

      - name: 准备 CGO 参数
        if: steps.plan.outputs.run == 'true' && (steps.policy.outputs.cgo-enabled != '' || steps.policy.outputs.cgo-ldflags != '' || steps.policy.outputs.cgo-library-dir != '')
        env:
          INPUT_CGO_ENABLED: ${{ steps.policy.outputs.cgo-enabled }}
          INPUT_CGO_LDFLAGS: ${{ steps.policy.outputs.cgo-ldflags }}
          INPUT_CGO_LIBRARY_DIR: ${{ steps.policy.outputs.cgo-library-dir }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_CGO_ENABLED" ]; then
            echo "CGO_ENABLED=$INPUT_CGO_ENABLED" >> "$GITHUB_ENV"
          fi

          if [ -n "$INPUT_CGO_LDFLAGS" ]; then
            echo "CGO_LDFLAGS=$INPUT_CGO_LDFLAGS" >> "$GITHUB_ENV"
          elif [ -n "$INPUT_CGO_LIBRARY_DIR" ]; then
            library_dir="${INPUT_CGO_LIBRARY_DIR#/}"
            echo "CGO_LDFLAGS=-L${GITHUB_WORKSPACE}/${library_dir}" >> "$GITHUB_ENV"
          fi

      - name: 运行 golangci-lint
        if: steps.plan.outputs.run == 'true'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ steps.policy.outputs.golangci-version }}
          working-directory: ${{ steps.policy.outputs.working-directory }}
          github-token: ${{ github.token }}

      - name: 跳过 Go 代码检查
        if: steps.plan.outputs.run != 'true'
        run: echo "没有 Go 相关改动，跳过 golangci-lint。"

      - name: 输出资源采样
        if: always()
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: finish
