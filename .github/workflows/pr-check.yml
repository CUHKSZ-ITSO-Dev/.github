name: PR 规范检查

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-check:
    name: PR 规范检查
    runs-on: ubuntu-slim
    timeout-minutes: 10
    concurrency:
      group: shared-pr-check-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 检查 PR 描述
        uses: CUHKSZ-ITSO-Dev/.github/actions/check-pr-body@main
        with:
          body: ${{ github.event.pull_request.body }}

      - name: 获取 PR 提交和 CI 改动
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const args = {...context.repo, pull_number: context.issue.number, per_page: 100};
            const {data: commits} = await github.rest.pulls.listCommits(args);
            if (!commits.length || commits.length > 30) {
              core.setFailed(`PR 包含 ${commits.length} 个 commit，要求 1–30 个。`);
              return;
            }
            const commitsFile = path.join(process.env.RUNNER_TEMP, 'pr-commits.json');
            fs.writeFileSync(commitsFile, JSON.stringify(commits));
            core.setOutput('commits-file', commitsFile);
            const files = await github.paginate(github.rest.pulls.listFiles, args);
            const workflows = files.filter(f => f.status !== 'removed' && /^\.github\/workflows\/[^/]+\.ya?ml$/.test(f.filename)).map(f => f.filename);
            const workflowsFile = path.join(process.env.RUNNER_TEMP, 'pr-workflows.json');
            fs.writeFileSync(workflowsFile, JSON.stringify(workflows));
            core.setOutput('workflows-file', workflowsFile);
            core.setOutput('has-workflows', workflows.length > 0);

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 检查 Commit Message
        uses: CUHKSZ-ITSO-Dev/.github/actions/check-pr-commits@main
        with:
          commits-file: ${{ steps.pr.outputs.commits-file }}

      - name: 校验改动的 CI 入口
        if: steps.pr.outputs.has-workflows == 'true'
        uses: CUHKSZ-ITSO-Dev/.github/actions/check-workflows@main
        with:
          files-json: ${{ steps.pr.outputs.workflows-file }}
