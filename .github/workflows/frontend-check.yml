name: 前端检查

on:
  workflow_call:
    inputs:
      check-profile:
        required: false
        type: string
        default: ""
        description: 集中配置的 lint、chromium、firefox 或 webkit 检查
      working-directory:
        required: false
        type: string
        default: "."
      node-version:
        required: false
        type: string
        default: "26.11.1"
      pnpm-version:
        required: false
        type: string
        default: "12.10.1"
      package-manager:
        required: false
        type: string
        default: pnpm
      cache-dependency-path:
        required: false
        type: string
        default: "**/pnpm-lock.yaml"
      changed-paths:
        required: false
        type: string
        default: |
          **/*
      ignored-paths:
        required: false
        type: string
        default: ""
      always-run-paths:
        required: false
        type: string
        default: ""
      predicate-quantifier:
        required: false
        type: string
        default: some
      install-command:
        required: false
        type: string
        default: "pnpm install --frozen-lockfile"
      playwright-browsers:
        required: false
        type: string
        default: ""
      check-command:
        required: false
        type: string
        default: "pnpm run lint"
      skip-draft-pr:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    concurrency:
      # 同一调用工作流可并行检查多个引擎，只取消同一引擎的过期任务。
      group: shared-frontend-check-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory || '.' }}-${{ inputs.check-profile || inputs.playwright-browsers || 'none' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 读取统一 CI 配置
        id: policy
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-policy@main
        with:
          kind: frontend-check
          profile: ${{ inputs.check-profile }}
          legacy-inputs: ${{ toJSON(inputs) }}

      - name: 开始资源采样
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: start

      - name: 判断检查范围
        id: plan
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-scope@main
        with:
          changed-paths: ${{ steps.policy.outputs.changed-paths }}
          skip-draft-pr: ${{ steps.policy.outputs.skip-draft-pr }}
          ignored-paths: ${{ steps.policy.outputs.ignored-paths }}
          always-run-paths: ${{ steps.policy.outputs.always-run-paths }}
          predicate-quantifier: ${{ steps.policy.outputs.predicate-quantifier }}

      - uses: actions/checkout@v7.0.1
        if: steps.plan.outputs.run == 'true' && github.event_name != 'push'
        with:
          persist-credentials: false

      - name: 选择浏览器用例
        id: e2e
        if: steps.plan.outputs.run == 'true'
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-e2e@main
        with:
          profile: ${{ inputs.check-profile }}
          reliable: ${{ steps.plan.outputs.reliable }}
          files: ${{ steps.plan.outputs.files }}
          command: ${{ steps.policy.outputs.check-command }}

      - name: 安装 pnpm
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ steps.policy.outputs.pnpm-version }}

      - name: 安装 Node.js
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.policy.outputs.node-version }}
          cache: ${{ steps.policy.outputs.package-manager }}
          cache-dependency-path: ${{ steps.policy.outputs.cache-dependency-path }}

      - name: 安装依赖
        if: steps.plan.outputs.run == 'true'
        working-directory: ${{ steps.policy.outputs.working-directory }}
        run: ${{ steps.policy.outputs.install-command }}

      - name: 安装 Playwright 浏览器
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-browsers != '' && steps.policy.outputs.playwright-image == ''
        working-directory: ${{ steps.policy.outputs.working-directory }}
        run: pnpm exec playwright install --with-deps ${{ steps.policy.outputs.playwright-browsers }}

      - name: 在预装浏览器环境执行完整检查
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-image != ''
        uses: CUHKSZ-ITSO-Dev/.github/actions/frontend-runtime@main
        with:
          image: ${{ steps.policy.outputs.playwright-image }}
          working-directory: ${{ steps.policy.outputs.working-directory }}
          command: ${{ steps.e2e.outputs.command }}

      - name: 保存浏览器测试证据
        if: always() && steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-image != ''
        uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ inputs.check-profile || inputs.playwright-browsers || 'default' }}
          path: |
            ${{ steps.policy.outputs.working-directory }}/test-results
            ${{ steps.policy.outputs.working-directory }}/playwright-report
          retention-days: 7

      - name: 执行前端检查
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-image == ''
        working-directory: ${{ steps.policy.outputs.working-directory }}
        run: ${{ steps.e2e.outputs.command }}

      - name: 跳过前端检查
        if: steps.plan.outputs.run != 'true'
        run: echo "无需执行前端检查。"

      - name: 输出资源采样
        if: always()
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: finish
