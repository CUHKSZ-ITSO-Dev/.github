name: 前端检查

on:
  workflow_call:
    inputs:
      check-profile:
        required: false
        type: string
        default: ""
        description: 集中配置的 lint、chromium、firefox 或 webkit 检查
      working-directory:
        required: false
        type: string
        default: "."
      node-version:
        required: false
        type: string
        default: "26.11.1"
      pnpm-version:
        required: false
        type: string
        default: "12.10.1"
      package-manager:
        required: false
        type: string
        default: pnpm
      cache-dependency-path:
        required: false
        type: string
        default: "**/pnpm-lock.yaml"
      changed-paths:
        required: false
        type: string
        default: |
          **/*
      ignored-paths:
        required: false
        type: string
        default: ""
      always-run-paths:
        required: false
        type: string
        default: ""
      predicate-quantifier:
        required: false
        type: string
        default: some
      install-command:
        required: false
        type: string
        default: "pnpm install --frozen-lockfile"
      playwright-browsers:
        required: false
        type: string
        default: ""
      check-command:
        required: false
        type: string
        default: "pnpm run lint"
      skip-draft-pr:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    concurrency:
      # 同一调用工作流可并行检查多个引擎，只取消同一引擎的过期任务。
      group: shared-frontend-check-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory || '.' }}-${{ inputs.check-profile || inputs.playwright-browsers || 'none' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 读取统一 CI 配置
        id: policy
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-policy@main
        with:
          kind: frontend-check
          profile: ${{ inputs.check-profile }}
          legacy-inputs: ${{ toJSON(inputs) }}

      - name: 开始资源采样
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: start

      - name: 准备路径过滤配置
        id: filter-config
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && (steps.policy.outputs.skip-draft-pr == 'false' || github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        env:
          CHANGED_PATHS: ${{ steps.policy.outputs.changed-paths }}
          IGNORED_PATHS: ${{ steps.policy.outputs.ignored-paths }}
          ALWAYS_RUN_PATHS: ${{ steps.policy.outputs.always-run-paths }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os

          def patterns(name):
              for pattern in os.environ[name].splitlines():
                  pattern = pattern.strip()
                  if pattern:
                      yield pattern

          print("filters<<EOF")
          print("changed:")
          for pattern in patterns("CHANGED_PATHS"):
              print(f"  - {pattern!r}")
          for pattern in patterns("IGNORED_PATHS"):
              print(f"  - '!{pattern}'")
          always_patterns = list(patterns("ALWAYS_RUN_PATHS"))
          if always_patterns:
              print("always:")
          for pattern in always_patterns:
              print(f"  - {pattern!r}")
          print("EOF")
          PY

      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 检查是否有前端相关改动
        id: check
        uses: dorny/paths-filter@v4.0.3
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && (steps.policy.outputs.skip-draft-pr == 'false' || github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        with:
          filters: ${{ steps.filter-config.outputs.filters }}
          predicate-quantifier: ${{ steps.policy.outputs.predicate-quantifier }}
          token: ${{ github.token }}

      - name: 判断是否执行前端检查
        id: plan
        env:
          CHANGED_OUTPUT: ${{ steps.check.outputs.changed }}
          ALWAYS_OUTPUT: ${{ steps.check.outputs.always }}
        run: |
          set -euo pipefail

          if [ "${{ steps.policy.outputs.skip-draft-pr }}" = "true" ] &&
            [ "${{ github.event_name }}" = "pull_request" ] &&
            [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "草稿 PR 跳过前端检查，门禁返回成功。"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALWAYS_OUTPUT" = "true" ] || [ "$CHANGED_OUTPUT" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR 无前端相关改动，跳过前端检查，门禁返回成功。"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.plan.outputs.run == 'true' && github.event_name != 'push'
        with:
          persist-credentials: false

      - name: 安装 pnpm
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ steps.policy.outputs.pnpm-version }}

      - name: 安装 Node.js
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.policy.outputs.node-version }}
          cache: ${{ steps.policy.outputs.package-manager }}
          cache-dependency-path: ${{ steps.policy.outputs.cache-dependency-path }}

      - name: 安装依赖
        if: steps.plan.outputs.run == 'true'
        working-directory: ${{ steps.policy.outputs.working-directory }}
        run: ${{ steps.policy.outputs.install-command }}

      - name: 安装 Playwright 浏览器
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-browsers != '' && steps.policy.outputs.playwright-image == ''
        working-directory: ${{ steps.policy.outputs.working-directory }}
        run: pnpm exec playwright install --with-deps ${{ steps.policy.outputs.playwright-browsers }}

      - name: 在预装浏览器环境执行完整检查
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-image != ''
        uses: CUHKSZ-ITSO-Dev/.github/actions/frontend-runtime@main
        with:
          image: ${{ steps.policy.outputs.playwright-image }}
          working-directory: ${{ steps.policy.outputs.working-directory }}
          command: ${{ steps.policy.outputs.check-command }}

      - name: 保存浏览器测试证据
        if: always() && steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-image != ''
        uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ inputs.check-profile || inputs.playwright-browsers || 'default' }}
          path: |
            ${{ steps.policy.outputs.working-directory }}/test-results
            ${{ steps.policy.outputs.working-directory }}/playwright-report
          retention-days: 7

      - name: 执行前端检查
        if: steps.plan.outputs.run == 'true' && steps.policy.outputs.playwright-image == ''
        working-directory: ${{ steps.policy.outputs.working-directory }}
        run: ${{ steps.policy.outputs.check-command }}

      - name: 跳过前端检查
        if: steps.plan.outputs.run != 'true'
        run: echo "无需执行前端检查。"

      - name: 输出资源采样
        if: always()
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-resources@main
        with:
          phase: finish
