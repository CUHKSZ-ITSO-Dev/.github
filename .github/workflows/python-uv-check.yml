name: 常规 Python uv 检查

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      sync-command:
        required: false
        type: string
        default: "uv sync --dev --frozen"
      check-command:
        required: true
        type: string
      changed-paths:
        required: false
        type: string
        default: |
          **/*
      ignored-paths:
        required: false
        type: string
        default: ""
      always-run-paths:
        required: false
        type: string
        default: ""
      predicate-quantifier:
        required: false
        type: string
        default: some
      skip-draft-pr:
        required: false
        type: boolean
        default: true
      env-vars:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: 常规 Python uv 检查
    runs-on: ubuntu-latest
    concurrency:
      group: shared-python-uv-check-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory || '.' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 读取统一 CI 配置
        id: policy
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-policy@main
        with:
          kind: python-uv-check
          legacy-inputs: ${{ toJSON(inputs) }}

      - name: 判断检查范围
        id: plan
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-scope@main
        with:
          changed-paths: ${{ steps.policy.outputs.changed-paths }}
          skip-draft-pr: ${{ steps.policy.outputs.skip-draft-pr }}
          ignored-paths: ${{ steps.policy.outputs.ignored-paths }}
          always-run-paths: ${{ steps.policy.outputs.always-run-paths }}
          predicate-quantifier: ${{ steps.policy.outputs.predicate-quantifier }}

      - uses: actions/checkout@v7.0.1
        if: steps.plan.outputs.run == 'true' && github.event_name != 'push'
        with:
          persist-credentials: false

      - name: 安装 uv
        if: steps.plan.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: 加载环境变量
        if: steps.plan.outputs.run == 'true' && inputs.env-vars != ''
        env:
          ENV_VARS: ${{ inputs.env-vars }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$ENV_VARS"

      - name: 安装依赖
        if: steps.plan.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.sync-command }}

      - name: 执行 Python 检查
        if: steps.plan.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.check-command }}

      - name: 跳过 Python 检查
        if: steps.plan.outputs.run != 'true'
        run: echo "无需执行 Python 检查。"
