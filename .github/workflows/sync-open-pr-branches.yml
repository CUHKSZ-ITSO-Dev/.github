name: 变基开放 PR 到最新主线

on:
  workflow_call:
    secrets:
      development_automation_token:
        description: 用于开发自动化、更新 PR 分支并正常触发后续检查
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-open-pr-branches:
    name: 变基最新 main
    runs-on: ubuntu-latest
    steps:
      - name: 检出主线历史
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 收集可自动变基的 PR
        id: pulls
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.development_automation_token }}
          result-encoding: string
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "main",
              per_page: 100,
            });

            const candidates = [];
            const skipped = [];
            for (const listedPull of pulls) {
              const title = listedPull.title.replaceAll("|", "\\|");
              if (listedPull.head.repo?.full_name !== `${owner}/${repo}`) {
                skipped.push([listedPull.number, title, "跳过", "外部仓库分支"]);
                continue;
              }
              candidates.push({
                number: listedPull.number,
                title,
                headRef: listedPull.head.ref,
                headSha: listedPull.head.sha,
              });
            }
            core.setOutput("skipped", JSON.stringify(skipped));
            return JSON.stringify(candidates);

      - name: 变基落后的 PR 分支
        env:
          GH_TOKEN: ${{ secrets.development_automation_token }}
          PULLS_JSON: ${{ steps.pulls.outputs.result }}
          SKIPPED_JSON: ${{ steps.pulls.outputs.skipped }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "开发自动化"
          git config --global user.email "dev-automation@cuhk.edu.cn"
          git config --global core.hooksPath /dev/null

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # checkout 禁用了 persist-credentials；后续 fetch 也必须使用自动化令牌。
          # 否则工作流会在收集 PR 后因 origin 无凭据而直接退出。
          git remote set-url origin "${remote_url}"
          base="main"
          git fetch --no-tags origin "${base}"
          base_sha="$(git rev-parse "origin/${base}")"

          results_file="$(mktemp)"
          printf '%s\n' "${SKIPPED_JSON}" | jq -c '.[]?' >> "${results_file}"

          while IFS= read -r pull; do
            number="$(jq -r '.number' <<<"${pull}")"
            title="$(jq -r '.title' <<<"${pull}")"
            head_ref="$(jq -r '.headRef' <<<"${pull}")"
            expected_head="$(jq -r '.headSha' <<<"${pull}")"

            fetched_ref="refs/remotes/origin/dev-portal-sync-${number}"
            if ! git fetch --no-tags origin \
              "+refs/heads/${head_ref}:${fetched_ref}"; then
              jq -nc --argjson number "${number}" --arg title "${title}" \
                '[ $number, $title, "跳过", "分支已不可读取，未覆盖" ]' >> "${results_file}"
              continue
            fi
            if [[ "$(git rev-parse "${fetched_ref}")" != "${expected_head}" ]]; then
              jq -nc --argjson number "${number}" --arg title "${title}" \
                '[ $number, $title, "跳过", "PR 有新提交，未覆盖" ]' >> "${results_file}"
              continue
            fi
            if git merge-base --is-ancestor "${base_sha}" "${expected_head}"; then
              jq -nc --argjson number "${number}" --arg title "${title}" \
                '[ $number, $title, "无需更新", "已基于最新 main" ]' >> "${results_file}"
              continue
            fi

            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha')"
            if [[ "${current_head}" != "${expected_head}" ]]; then
              jq -nc --argjson number "${number}" --arg title "${title}" \
                '[ $number, $title, "跳过", "PR 有新提交，未覆盖" ]' >> "${results_file}"
              continue
            fi

            worktree="$(mktemp -d)"
            rmdir "${worktree}"
            git worktree add --detach "${worktree}" "${expected_head}" >/dev/null
            if git -C "${worktree}" rebase "origin/${base}"; then
              current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha')"
              if [[ "${current_head}" != "${expected_head}" ]]; then
                jq -nc --argjson number "${number}" --arg title "${title}" \
                  '[ $number, $title, "跳过", "变基期间 PR 有新提交，未覆盖" ]' >> "${results_file}"
              elif git -C "${worktree}" push "${remote_url}" \
                "HEAD:refs/heads/${head_ref}" \
                "--force-with-lease=refs/heads/${head_ref}:${expected_head}"; then
                jq -nc --argjson number "${number}" --arg title "${title}" \
                  '[ $number, $title, "已变基", "已更新至最新 main；开发提交逐条保留" ]' >> "${results_file}"
              else
                jq -nc --argjson number "${number}" --arg title "${title}" \
                  '[ $number, $title, "跳过", "远端分支已变化，未覆盖" ]' >> "${results_file}"
              fi
            else
              git -C "${worktree}" rebase --abort || true
              jq -nc --argjson number "${number}" --arg title "${title}" \
                '[ $number, $title, "需手动处理", "与最新 main 存在冲突，未推送" ]' >> "${results_file}"
            fi
            git worktree remove --force "${worktree}"
          done < <(printf '%s\n' "${PULLS_JSON}" | jq -c '.[]?')

          {
            echo "## 开放 PR 主线变基结果"
            echo
            echo "主线：\`${base_sha}\`"
            echo
            echo "| PR | 标题 | 结果 | 说明 |"
            echo "| --- | --- | --- | --- |"
            while IFS= read -r item; do
              number="$(jq -r '.[0]' <<<"${item}")"
              title="$(jq -r '.[1]' <<<"${item}")"
              result="$(jq -r '.[2]' <<<"${item}")"
              detail="$(jq -r '.[3]' <<<"${item}")"
              echo "| #${number} | ${title} | ${result} | ${detail} |"
            done < "${results_file}"
          } >> "${GITHUB_STEP_SUMMARY}"
