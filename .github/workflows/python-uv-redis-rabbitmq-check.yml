name: 常规 Python uv Redis RabbitMQ 检查

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      sync-command:
        required: false
        type: string
        default: "uv sync --dev --frozen"
      check-command:
        required: true
        type: string
      changed-paths:
        required: false
        type: string
        default: '**/*'
      ignored-paths:
        required: false
        type: string
        default: ''
      always-run-paths:
        required: false
        type: string
        default: ''
      predicate-quantifier:
        required: false
        type: string
        default: some
      skip-draft-pr:
        required: false
        type: boolean
        default: true
      env-vars:
        required: false
        type: string
        default: |
          REDIS_URL=redis://localhost:6379
          RABBITMQ_URL=amqp://guest:guest@localhost:5672/

permissions:
  contents: read

jobs:
  scope:
    name: 识别集成检查范围
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: 读取统一 CI 配置
        id: policy
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-policy@main
        with:
          kind: python-uv-redis-rabbitmq-check
          legacy-inputs: ${{ toJSON(inputs) }}
      - name: 判断检查范围
        id: plan
        uses: CUHKSZ-ITSO-Dev/.github/actions/ci-scope@main
        with:
          changed-paths: ${{ steps.policy.outputs.changed-paths }}
          ignored-paths: ${{ steps.policy.outputs.ignored-paths }}
          always-run-paths: ${{ steps.policy.outputs.always-run-paths }}
          predicate-quantifier: ${{ steps.policy.outputs.predicate-quantifier }}
          skip-draft-pr: ${{ steps.policy.outputs.skip-draft-pr }}
          token: ''

  check:
    name: 常规 Python uv Redis RabbitMQ 检查
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    concurrency:
      group: shared-python-uv-redis-rabbitmq-check-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory || '.' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: 加载环境变量
        if: inputs.env-vars != ''
        env:
          ENV_VARS: ${{ inputs.env-vars }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$ENV_VARS"

      - name: 安装依赖
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.sync-command }}

      - name: 执行 Python 集成检查
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.check-command }}
